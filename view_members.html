<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Members - Gym Kebanggaan Pak Karim</title>
  <style>
      body {
          font-family: Arial, sans-serif;
          background: #f9f9f9;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
          margin: 0;
      }
      .container {
          background: #fff;
          padding: 2rem;
          border-radius: 8px;
          box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
          width: 90%;
          max-width: 800px;
      }
      h1, h2 {
          text-align: center;
          color: #333;
          margin-bottom: 20px;
      }
      table {
          width: 100%;
          border-collapse: collapse;
          margin-bottom: 20px;
      }
      th, td {
          border: 1px solid #ccc;
          padding: 0.75rem;
          text-align: left;
      }
      th {
          background-color: #f3f3f3;
      }
      a {
          text-decoration: none;
          color: #cf3232;
          font-weight: bold;
      }
      input[type="submit"] {
          background-color: #cf3232;
          border: none;
          color: #fff;
          padding: 0.5rem 1rem;
          border-radius: 4px;
          cursor: pointer;
      }
      input[type="submit"]:hover {
          background-color: #cf3232;
      }
  </style>
</head>
<body>
  <div class="container">
      <h2>Gym Kebanggaan Pak Karim</h2>
      <h1>View Members</h1>
      {% if members %}
      <table>
          <tr>
              <th>Member Name</th>
              <th>Membership Status</th>
              <th>Actions</th>
          </tr>
          {% for member in members %}
          <tr>
              <td>{{ member[1] }}</td>
              <td>{{ member[2] }}</td>
              <td>
                  <a href="{{ url_for('member_classes', member_id=member[0]) }}">View Classes</a> |
                  <form action="{{ url_for('delete_member', member_id=member[0]) }}" method="POST" style="display:inline;">
                      <input type="submit" value="Delete">
                  </form>
              </td>
          </tr>
          {% endfor %}
      </table>
      {% else %}
          <p>No members available.</p>
      {% endif %}
      <a href="{{ url_for('add_member') }}">Add New Member</a>
      <br>
      <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
  </div>
</body>
</html>
