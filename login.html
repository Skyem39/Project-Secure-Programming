<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Kebanggaan Pak Karim - Login</title>
  <style>
      body {
          font-family: Arial, sans-serif;
          background: #f9f9f9;
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          margin: 0;
      }
      form {
          background: #fff;
          padding: 2rem;
          border-radius: 8px;
          box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
          width: 300px;
      }
      h1 {
          text-align: center;
          color: #333;
      }
      label {
          font-weight: bold;
          display: block;
          margin-top: 10px;
      }
      input[type="text"],
      input[type="password"] {
          width: 100%;
          padding: 0.5rem;
          margin: 5px 0 15px;
          border: 1px solid #ccc;
          border-radius: 4px;
          box-sizing: border-box;
      }
      button {
          width: 100%;
          padding: 0.75rem;
          background-color: #cf3232;
          border: none;
          color: #fff;
          font-size: 1rem;
          border-radius: 4px;
          cursor: pointer;
      }
      button:hover {
          background-color: #cf3232;
      }
      .captcha-container {
          text-align: center;
          margin: 15px 0;
      }
      .captcha-container img {
          border: 1px solid #ddd;
          border-radius: 4px;
          margin-bottom: 10px;
      }
      ul {
          list-style: none;
          padding: 0;
          margin: 0 0 15px 0;
      }
      ul li {
          background: #ffdddd;
          border: 1px solid #ff5c5c;
          padding: 0.5rem;
          margin-bottom: 10px;
          border-radius: 4px;
          color: #a94442;
          text-align: center;
      }
  </style>
</head>
<body>
  <form method="POST">
    <h1>Gym Kebanggaan Pak Karim</h1>
      {% with messages = get_flashed_messages() %}
          {% if messages %}
              <ul>
                  {% for message in messages %}
                      <li>{{ message }}</li>
                  {% endfor %}
              </ul>
          {% endif %}
      {% endwith %}

      <label for="username">Username:</label>
      <input type="text" name="username" id="username" {% if disabled %}disabled{% endif %} required>

      <label for="password">Password:</label>
      <input type="password" name="password" id="password" {% if disabled %}disabled{% endif %} required>
      <button type="submit" {% if disabled %}disabled{% endif %}>Login</button>
  </form>
</body>
</html>
