<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register New Member - Gym Kebanggaan Pak Karim</title>
  <style>
      body {
          font-family: Arial, sans-serif;
          background: #f9f9f9;
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          margin: 0;
      }
      .container {
          background: #fff;
          padding: 2rem;
          border-radius: 8px;
          box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
          width: 300px;
          text-align: center;
      }
      h1, h2 {
          color: #333;
          margin: 0 0 10px;
      }
      form {
          margin-top: 15px;
      }
      label {
          font-weight: bold;
          display: block;
          margin-top: 10px;
          text-align: left;
      }
      input[type="text"],
      select {
          width: 100%;
          padding: 0.5rem;
          margin: 5px 0 15px;
          border: 1px solid #ccc;
          border-radius: 4px;
          box-sizing: border-box;
      }
      input[type="submit"] {
          width: 100%;
          padding: 0.75rem;
          background-color: #cf3232;
          border: none;
          color: #fff;
          font-size: 1rem;
          border-radius: 4px;
          cursor: pointer;
      }
      input[type="submit"]:hover {
          background-color: #cf3232;
      }
      a {
          display: block;
          margin-top: 15px;
          text-decoration: none;
          color: #cf3232;
          font-weight: bold;
      }
  </style>
</head>
<body>
  <div class="container">
      <h1>Register New Member</h1>
      <form action="{{ url_for('register_member') }}" method="POST">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>
          <label for="status">Membership Status:</label>
          <select id="status" name="status" required>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
          </select>
          <input type="submit" value="Register Member">
      </form>
      <a href="{{ url_for('view_members') }}">View Members</a>
  </div>
</body>
</html>
