<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ member[1] }}'s Classes - Gym Kebanggaan Pak Karim</title>
  <style>
      body {
          font-family: Arial, sans-serif;
          background: #f9f9f9;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
          margin: 0;
      }
      .container {
          background: #fff;
          padding: 2rem;
          border-radius: 8px;
          box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
          width: 90%;
          max-width: 800px;
          text-align: center;
      }
      h1, h2 {
          color: #333;
          margin-bottom: 20px;
      }
      table {
          width: 100%;
          border-collapse: collapse;
          margin-bottom: 20px;
      }
      th, td {
          border: 1px solid #ccc;
          padding: 0.75rem;
          text-align: left;
      }
      th {
          background-color: #f3f3f3;
      }
      a {
          display: block;
          margin-top: 15px;
          text-decoration: none;
          color: #cf3232;
          font-weight: bold;
      }
  </style>
</head>
<body>
  <div class="container">
      <h1>Classes for {{ member[1] }}</h1>
      {% if classes %}
          <table>
              <tr>
                  <th>Class Name</th>
                  <th>Class Time</th>
              </tr>
              {% for class in classes %}
              <tr>
                  <td>{{ class[0] }}</td>
                  <td>{{ class[1] }}</td>
              </tr>
              {% endfor %}
          </table>
      {% else %}
          <p>No classes registered for this member.</p>
      {% endif %}
      <a href="{{ url_for('view_members') }}">Back to Members List</a>
      <a href="{{ url_for('register_class', member_id=member[0]) }}">Register New Class for {{ member[1] }}</a>
  </div>
</body>
</html>
